name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1"
        required: true
        type: string
      eov_ref:
        description: "eov tag or commit to build against (default: [package.metadata.eov] ref in Cargo.toml)"
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      eov_source_sha: ${{ steps.meta.outputs.eov_source_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      reuse_draft: ${{ steps.meta.outputs.reuse_draft }}
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version, source metadata, and release uniqueness
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs reach the script only through the environment (GPD-8).
          REQUESTED_VERSION: ${{ inputs.version }}
          EOV_REF: ${{ inputs.eov_ref }}
        shell: bash
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          python3 scripts/release.py validate-source --root . --version "$version"
          tag="v$version"
          source_sha="$GITHUB_SHA"

          # The checkout keeps no credentials, so ask the API (validated
          # SemVer only reaches the jq filter).
          existing_tags="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/$tag" \
            --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")"
          if [[ "$existing_tags" != "0" ]]; then
            echo "tag '$tag' already exists" >&2
            exit 1
          fi

          existing_releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$tag\")]")"
          existing_count="$(jq 'length' <<<"$existing_releases")"
          reuse_draft="false"
          if [[ "$existing_count" -gt 1 ]]; then
            echo "multiple GitHub Releases exist for '$tag'" >&2
            exit 1
          elif [[ "$existing_count" -eq 1 ]]; then
            existing_draft="$(jq -r '.[0].draft' <<<"$existing_releases")"
            existing_target="$(jq -r '.[0].target_commitish' <<<"$existing_releases")"
            if [[ "$existing_draft" != "true" ]]; then
              echo "published GitHub Release '$tag' already exists" >&2
              exit 1
            fi
            if [[ "$existing_target" != "$source_sha" ]]; then
              echo "existing draft '$tag' targets $existing_target, expected $source_sha" >&2
              exit 1
            fi
            reuse_draft="true"
          fi

          # Build against the pinned eov release, not eov's default branch.
          eov_ref="$(python3 scripts/eov_ref.py | sed -n 's/^ref=//p')"
          eov_source_sha="$(gh api "repos/eosin-platform/eov/commits/$eov_ref" --jq .sha)"
          echo "building against eov $eov_ref ($eov_source_sha)"
          {
            echo "source_sha=$source_sha"
            echo "eov_source_sha=$eov_source_sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "reuse_draft=$reuse_draft"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-linux-eop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      eov_source_sha: ${{ needs.prepare.outputs.eov_source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-macos:
    name: macOS
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos-eop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      eov_source_sha: ${{ needs.prepare.outputs.eov_source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-windows:
    name: Windows
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows-eop.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      eov_source_sha: ${{ needs.prepare.outputs.eov_source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  aggregate:
    name: Aggregate and validate artifacts
    needs: [prepare, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Stage artifacts and generate release.toml
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release-files
          python3 scripts/release.py manifest \
            --root . \
            --plugin-name gamepad \
            --version "$VERSION" \
            --repository eosin-platform/eov-gamepad-plugin \
            --artifacts-dir artifacts \
            --staging-dir release-files \
            --output release-files/release.toml
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload validated release staging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gamepad-release-staging-${{ github.run_id }}
          path: release-files
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, aggregate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download validated release staging
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gamepad-release-staging-${{ github.run_id }}
          path: release-files
          merge-multiple: true

      - name: Create or update draft release at SOURCE_SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_DRAFT: ${{ needs.prepare.outputs.reuse_draft }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REUSE_DRAFT" == 'true' ]]; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" \
              --target "$SOURCE_SHA" \
              --title "Gamepad $VERSION" \
              --generate-notes \
              --draft \
              release-files/*
          fi

      - name: Verify draft release target and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          source_sha="$RELEASE_SHA"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$tag\")][0]")"
          [[ "$release_json" != "null" ]] || {
            echo "draft release $tag was not found" >&2
            exit 1
          }
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$tag" ]] || {
            echo "draft release has an unexpected tag name" >&2
            exit 1
          }
          [[ "$(jq -r '.draft' <<<"$release_json")" == "true" ]] || {
            echo "release $tag is not a draft" >&2
            exit 1
          }
          draft_target="$(jq -r '.target_commitish' <<<"$release_json")"
          [[ "$draft_target" == "$source_sha" ]] || {
            echo "draft release $tag targets $draft_target, expected $source_sha" >&2
            exit 1
          }
          expected="$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: gh release edit "$TAG" --draft=false

      - name: Verify published tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          source_sha="$RELEASE_SHA"
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          if [[ "$object_type" == "tag" ]]; then
            object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$object_sha" --jq .object.sha)"
          fi
          [[ "$object_sha" == "$source_sha" ]] || {
            echo "published tag $tag points at $object_sha, expected $source_sha" >&2
            exit 1
          }

      - name: Verify published asset URLs and hashes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release.py verify-assets \
            --root . \
            --plugin-name gamepad \
            --version "$VERSION" \
            --repository eosin-platform/eov-gamepad-plugin \
            --manifest release-files/release.toml
          curl --fail --location --silent --show-error \
            "https://github.com/eosin-platform/eov-gamepad-plugin/releases/download/$TAG/release.toml" \
            | cmp - release-files/release.toml