name: Build macOS .eop

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact plugin source commit to build"
        required: true
        type: string
      eov_source_sha:
        description: "Exact eov commit whose eov-plugin-api to build against"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact plugin source commit to build"
        required: true
        type: string
      eov_source_sha:
        description: "Exact eov commit whose eov-plugin-api to build against"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos-eop:
    name: Build macOS .eop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin

    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Check out eov-plugin-api
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: eosin-platform/eov
          ref: ${{ inputs.eov_source_sha }}
          path: eov-src
          sparse-checkout: plugin_api
          persist-credentials: false

      - name: Link eov-plugin-api next to the plugin
        shell: bash
        run: |
          set -euo pipefail
          work_root="$(cd "$GITHUB_WORKSPACE/../.." && pwd)"
          ln -sfn "$GITHUB_WORKSPACE/eov-src/plugin_api" "$work_root/plugin_api"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ matrix.arch }}

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release.py validate-source --root . --version "$VERSION"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "release tag '$TAG' does not match version '$VERSION'" >&2
            exit 1
          fi
          artifact_name="gamepad-${TAG}-macos-${ARCH}.eop"
          {
            echo "artifact_name=$artifact_name"
            echo "checksum_name=${artifact_name}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugin library
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$RUST_TARGET"

      - name: Package .eop
        shell: bash
        env:
          ARTIFACT: ${{ steps.meta.outputs.artifact_name }}
          CHECKSUM: ${{ steps.meta.outputs.checksum_name }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python scripts/package_eop.py \
            --plugin-root "$GITHUB_WORKSPACE" \
            --library "target/$RUST_TARGET/release/libgamepad.dylib" \
            --output "dist/$ARTIFACT"
          cd dist
          shasum -a 256 "$ARTIFACT" > "$CHECKSUM"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.meta.outputs.artifact_name }}
            dist/${{ steps.meta.outputs.checksum_name }}
          if-no-files-found: error
